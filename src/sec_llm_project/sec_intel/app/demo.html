<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC Filings Q&amp;A</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2a5bd7; --accent-ink: #ffffff; --ok: #1f7a4d; --warn: #9a5b00; --bad: #b42318;
    --chip: #eef1f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f;
      --accent: #7aa2ff; --accent-ink: #10131a; --ok: #5cc28f; --warn: #e0a54a; --bad: #f2786d;
      --chip: #262a33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
                    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 76px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-top: 12px; }
  .row > div { flex: 1 1 160px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 9px 14px;
                font: inherit; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
        padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .go:disabled { opacity: .5; cursor: default; }
  .est { color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 21px; }
  .stages { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
  .stage { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--chip);
           color: var(--muted); }
  .stage.now { color: var(--ink); outline: 2px solid var(--accent); }
  .stage.done { color: var(--ok); }
  .clock { font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 650; }
  .answer { white-space: pre-wrap; }
  .warn { color: var(--warn); font-size: 14px; margin-top: 10px; }
  .src { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .src b { color: var(--accent); }
  .src .ex { color: var(--muted); margin-top: 4px; }
  .claim { display: flex; gap: 10px; font-size: 14px; padding: 6px 0;
           border-top: 1px solid var(--line); }
  .v { flex: 0 0 auto; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
       background: var(--chip); }
  .v.SUPPORTED { color: var(--ok); } .v.PARTIAL { color: var(--warn); }
  .v.UNSUPPORTED, .v.CONTRADICTED { color: var(--bad); }
  .err { color: var(--bad); }
  .muted { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Ask the SEC filings</h1>
  <p class="sub">Answers from 10-K, 10-Q and 8-K filings, with numbered sources. Runs on one
    laptop with local models; one question at a time.</p>

  <div class="card">
    <label for="q">Question</label>
    <textarea id="q" maxlength="500"
      placeholder="What does Waters say about its cyber insurance?"></textarea>
    <div class="row">
      <div><label for="t">Ticker (optional)</label><input id="t" maxlength="10" placeholder="WAT"></div>
      <div style="flex:0 0 auto">
        <label>Mode</label>
        <div class="seg">
          <button id="m-fast" class="on" type="button">Fast</button>
          <button id="m-verified" type="button">Verified</button>
        </div>
      </div>
      <div style="flex:0 0 auto"><button class="go" id="go">Ask</button></div>
    </div>
    <div class="est" id="est"></div>
    <details style="margin-top:10px"><summary>API key</summary>
      <input id="k" type="password" placeholder="paste the demo key" style="margin-top:8px">
    </details>
  </div>

  <div class="card" id="progress" hidden>
    <div class="stages" id="stages"></div>
    <div class="clock" id="clock">–</div>
    <div class="muted" id="pmsg"></div>
  </div>

  <div class="card" id="out" hidden></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let mode = "fast", timer = null, deadline = null;
const STAGES = {fast: ["queued", "retrieving", "answering"],
                verified: ["queued", "retrieving", "answering", "verifying"]};
const LABEL = {queued: "In queue", retrieving: "Finding passages", answering: "Writing answer",
               verifying: "Checking claims"};

function key() { try { return localStorage.getItem("secKey") || ""; } catch { return ""; } }
$("k").value = key();
$("k").addEventListener("change", () => { try { localStorage.setItem("secKey", $("k").value); } catch {} estimate(); });

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json",
    "Authorization": "Bearer " + $("k").value, ...(opts.headers || {})}});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || ("HTTP " + r.status));
  return body;
}
function setMode(m) {
  mode = m;
  $("m-fast").classList.toggle("on", m === "fast");
  $("m-verified").classList.toggle("on", m === "verified");
  estimate();
}
$("m-fast").onclick = () => setMode("fast");
$("m-verified").onclick = () => setMode("verified");

async function estimate() {
  if (!$("k").value) { $("est").textContent = "Add the API key below to ask."; return; }
  try {
    const e = await api("/v1/estimate?mode=" + mode);
    $("est").textContent = `Expected time now: about ${e.estimated_seconds} s` +
      (e.wait_seconds ? ` (${e.wait_seconds} s waiting for ${e.queue_length} question(s) ahead)` : "") +
      (mode === "fast" ? " · fast mode skips the claim check" : " · includes the claim check");
  } catch (err) { $("est").textContent = err.message; }
}

function drawStages(m, now) {
  const order = STAGES[m], i = order.indexOf(now);
  $("stages").innerHTML = order.map((s, j) =>
    `<span class="stage ${j < i || now === "done" ? "done" : ""} ${s === now ? "now" : ""}">${LABEL[s]}</span>`).join("");
}
function tick() {
  if (deadline === null) return;
  const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
  $("clock").textContent = left > 0 ? `~${left} s left` : "almost there…";
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function show(st) {
  const r = st.result, out = $("out");
  out.hidden = false;
  if (st.status === "failed") { out.innerHTML = `<p class="err">Failed: ${esc(st.error)}</p>`; return; }
  if (!r) return;
  let h = `<div class="muted">${esc(st.ticker)} · ${r.verified ? "verified" : "fast"} · ${r.total_seconds} s</div>`;
  h += `<p class="answer">${esc(r.answer)}</p>`;
  if (r.warning) h += `<div class="warn">${esc(r.warning)}</div>`;
  if (r.claims && r.claims.length) {
    h += `<h3 style="font-size:15px;margin:18px 0 4px">Claim check (groundedness ${r.groundedness})</h3>`;
    h += r.claims.map(c => `<div class="claim"><span class="v ${c.verdict}">${c.verdict}</span><span>${esc(c.claim)}${c.source ? ` <b>[${c.source}]</b>` : ""}</span></div>`).join("");
  }
  if (r.sources && r.sources.length) {
    h += `<h3 style="font-size:15px;margin:18px 0 4px">Sources</h3>`;
    h += r.sources.map(s => `<div class="src"><b>[${s.n}]</b> ${esc(s.company)} · ${esc(s.form)} filed ${esc(s.filing_date)} · ${esc(s.section)}` +
      (s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">SEC</a>` : "") +
      `<div class="ex">“${esc(s.excerpt)}…”</div></div>`).join("");
  }
  out.innerHTML = h;
}

async function poll(id, m) {
  try {
    const st = await api("/v1/questions/" + id);
    const stage = st.status === "queued" ? "queued" : (st.stage || st.status);
    drawStages(m, stage);
    if (st.estimated_seconds_remaining !== undefined)
      deadline = Date.now() + st.estimated_seconds_remaining * 1000;
    $("pmsg").textContent = st.status === "queued" ? `Position ${st.queue_position} in the queue` :
      (st.elapsed_seconds !== undefined ? `${st.elapsed_seconds} s so far` : "");
    if (["done", "failed", "cancelled"].includes(st.status)) {
      clearInterval(timer); deadline = null;
      $("clock").textContent = st.status === "done" ? `Done in ${st.result.total_seconds} s` : st.status;
      $("go").disabled = false; show(st); estimate(); return;
    }
  } catch (err) { $("pmsg").textContent = err.message; }
  setTimeout(() => poll(id, m), 1500);
}

$("go").onclick = async () => {
  const question = $("q").value.trim();
  if (!question) return;
  $("go").disabled = true; $("out").hidden = true;
  try {
    const st = await api("/v1/questions", {method: "POST", body: JSON.stringify(
      {question, ticker: $("t").value.trim() || null, mode})});
    $("progress").hidden = false;
    deadline = Date.now() + (st.estimated_seconds_remaining ?? st.estimated_seconds_at_submit) * 1000;
    clearInterval(timer); timer = setInterval(tick, 250);
    drawStages(mode, "queued"); poll(st.id, mode);
  } catch (err) {
    $("go").disabled = false; $("est").innerHTML = `<span class="err">${esc(err.message)}</span>`;
  }
};
estimate();
</script>
</body>
</html>
